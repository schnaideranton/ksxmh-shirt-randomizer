<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KSxMH Shirt Randomizer</title>
  <style>
    :root {
      --paper: #f6f0e5;
      --paper-2: #ece2d2;
      --ink: #161410;
      --muted: #6b6257;
      --rule: rgba(22, 20, 16, 0.16);
      --accent: #cf2e2e;
      --acid: #c9ff3b;
      --blue: #245bb7;
      --panel: rgba(255, 252, 245, 0.78);
      --shadow: 0 20px 60px rgba(35, 27, 18, 0.18);
      --mono: "Avenir Next", "DIN Alternate", "Helvetica Neue", sans-serif;
      --serif: Georgia, "Times New Roman", serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        linear-gradient(90deg, rgba(22, 20, 16, 0.035) 1px, transparent 1px) 0 0 / 28px 28px,
        linear-gradient(0deg, rgba(22, 20, 16, 0.025) 1px, transparent 1px) 0 0 / 28px 28px,
        radial-gradient(circle at 18% 12%, rgba(36, 91, 183, 0.09), transparent 32%),
        radial-gradient(circle at 84% 86%, rgba(207, 46, 46, 0.08), transparent 28%),
        var(--paper);
      color: var(--ink);
      font-family: var(--mono);
    }

    body {
      height: 100vh;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      color: inherit;
      cursor: pointer;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(640px, 1fr) 380px;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
    }

    .stage {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 22px 22px 22px 28px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 42px;
      gap: 18px;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 14px;
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(25px, 3vw, 42px);
      font-weight: 400;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .brand span {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .seed {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .seed input {
      width: 112px;
      height: 34px;
      border: 1px solid var(--rule);
      border-radius: 4px;
      background: rgba(255, 252, 245, 0.76);
      color: var(--ink);
      padding: 0 10px;
      outline: 0;
    }

    .seed input:focus {
      border-color: rgba(22, 20, 16, 0.45);
    }

    .canvas-wrap {
      flex: 1;
      display: grid;
      place-items: center;
      min-height: 0;
      padding: 24px 0 0;
    }

    canvas#shirtCanvas {
      width: min(100%, 1340px);
      height: auto;
      max-height: calc(100vh - 118px);
      aspect-ratio: 16 / 10;
      background: #fffdf8;
      border: 1px solid rgba(22, 20, 16, 0.22);
      border-radius: 6px;
      box-shadow: var(--shadow);
    }

    .rail {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-y: auto;
      border-left: 1px solid var(--rule);
      background: var(--panel);
      backdrop-filter: blur(12px);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 22px;
      border-bottom: 1px solid var(--rule);
    }

    .primary,
    .secondary,
    .ghost {
      min-height: 42px;
      border-radius: 5px;
      letter-spacing: 0.02em;
      transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
    }

    .primary {
      background: var(--ink);
      color: var(--paper);
      box-shadow: 0 8px 22px rgba(22, 20, 16, 0.22);
    }

    .secondary {
      background: var(--acid);
      color: var(--ink);
      box-shadow: inset 0 0 0 1px rgba(22, 20, 16, 0.2);
    }

    .ghost {
      background: transparent;
      box-shadow: inset 0 0 0 1px var(--rule);
      color: var(--muted);
    }

    .primary:hover,
    .secondary:hover,
    .ghost:hover {
      transform: translateY(-1px);
    }

    .primary:active,
    .secondary:active,
    .ghost:active {
      transform: translateY(0);
    }

    .rail-section {
      padding: 18px 22px 20px;
      border-bottom: 1px solid var(--rule);
    }

    .rail-section h2 {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 12px;
    }

    .section-head h2 {
      margin: 0;
    }

    .section-lock {
      min-height: 28px;
      border-radius: 4px;
      background: rgba(22, 20, 16, 0.9);
      color: var(--paper);
      padding: 0 10px;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .section-lock[aria-pressed="true"] {
      background: var(--acid);
      color: var(--ink);
      box-shadow: inset 0 0 0 1px rgba(22, 20, 16, 0.2);
    }

    .priority-section {
      background: rgba(255, 252, 245, 0.44);
    }

    .parts {
      display: grid;
      gap: 6px;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .quick-button {
      min-height: 36px;
      border-radius: 5px;
      background: rgba(255, 252, 245, 0.64);
      box-shadow: inset 0 0 0 1px var(--rule);
      color: var(--ink);
      font-size: 12px;
      text-align: center;
    }

    .quick-button:hover {
      background: rgba(201, 255, 59, 0.46);
    }

    .part-row {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) 34px 76px;
      align-items: center;
      gap: 10px;
      min-height: 36px;
      border: 1px solid transparent;
      border-radius: 5px;
      padding: 5px 7px;
      background: rgba(255, 252, 245, 0.52);
    }

    .part-row.active {
      border-color: rgba(36, 91, 183, 0.42);
      background: rgba(36, 91, 183, 0.08);
    }

    .part-row input {
      accent-color: var(--ink);
    }

    .part-row button {
      min-width: 0;
      background: transparent;
      text-align: left;
      overflow: hidden;
    }

    .part-name {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      color: var(--ink);
    }

    .part-pattern {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .part-reroll {
      width: 34px;
      height: 24px;
      border-radius: 4px;
      box-shadow: inset 0 0 0 1px rgba(22, 20, 16, 0.18);
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-align: center;
    }

    .part-reroll:hover {
      background: var(--ink);
      color: var(--paper);
    }

    .part-reroll:disabled,
    .part-row input:disabled {
      cursor: default;
      opacity: 0.42;
    }

    .part-reroll:disabled:hover {
      background: transparent;
      color: var(--muted);
    }

    .tiny-swatch {
      width: 76px;
      height: 24px;
      border: 1px solid rgba(22, 20, 16, 0.18);
      border-radius: 3px;
      background: #fff;
    }

    .library {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .scale-panel {
      display: grid;
      gap: 12px;
    }

    .scale-name {
      min-height: 18px;
      overflow: hidden;
      color: var(--ink);
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .scale-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 72px 18px;
      align-items: center;
      gap: 10px;
    }

    .scale-row input[type="range"] {
      width: 100%;
      accent-color: var(--ink);
    }

    .scale-row input[type="number"] {
      width: 72px;
      height: 34px;
      border: 1px solid var(--rule);
      border-radius: 4px;
      background: rgba(255, 252, 245, 0.76);
      color: var(--ink);
      padding: 0 8px;
      outline: 0;
      text-align: right;
    }

    .scale-row span {
      color: var(--muted);
      font-size: 12px;
    }

    .pattern-button {
      position: relative;
      height: 54px;
      overflow: hidden;
      border: 1px solid rgba(22, 20, 16, 0.18);
      border-radius: 5px;
      background: #fff;
    }

    .pattern-button canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .pattern-button[aria-pressed="true"] {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .footer-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 18px 22px 22px;
      margin-top: auto;
    }

    .status {
      min-height: 28px;
      padding: 0 22px 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    @media (max-width: 1080px) {
      body {
        height: auto;
      }

      .app {
        grid-template-columns: 1fr;
        height: auto;
        overflow: visible;
      }

      .rail {
        min-height: auto;
        overflow: visible;
        border-left: 0;
        border-top: 1px solid var(--rule);
      }

      .stage {
        padding: 18px;
      }

      canvas#shirtCanvas {
        max-height: none;
      }
    }

    @media (max-width: 720px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .brand {
        flex-direction: column;
        gap: 4px;
      }

      .brand h1 {
        white-space: normal;
      }

      .actions,
      .footer-actions {
        grid-template-columns: 1fr;
      }

      .library {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="stage" aria-label="shirt preview">
      <div class="topbar">
        <div class="brand">
          <h1>KSxMH Shirt Randomizer</h1>
          <span>patchwork sketch</span>
        </div>
        <label class="seed">
          Seed
          <input id="seedInput" inputmode="numeric" aria-label="Seed">
        </label>
      </div>
      <div class="canvas-wrap">
        <canvas id="shirtCanvas" width="1600" height="1000"></canvas>
      </div>
    </section>

    <aside class="rail" aria-label="controls">
      <div class="actions">
        <button id="randomizeButton" class="primary" type="button">New Variant</button>
        <button id="saveButton" class="secondary" type="button">Save PNG</button>
      </div>

      <section class="rail-section">
        <h2>Randomize</h2>
        <div id="quickControls" class="quick-grid"></div>
      </section>

      <section class="rail-section priority-section">
        <div class="section-head">
          <h2>Core Parts</h2>
          <button id="coreLockButton" class="section-lock" type="button">Lock Block</button>
        </div>
        <div id="corePartsList" class="parts"></div>
      </section>

      <section class="rail-section">
        <h2>Parts</h2>
        <div id="partsList" class="parts"></div>
      </section>

      <section class="rail-section">
        <h2>Fabrics</h2>
        <div id="patternLibrary" class="library"></div>
      </section>

      <section class="rail-section">
        <h2>Pattern Scale</h2>
        <div class="scale-panel">
          <div id="scalePatternName" class="scale-name"></div>
          <div class="scale-row">
            <input id="patternScaleSlider" type="range" min="0" max="200" step="5" value="100" aria-label="Pattern scale percent">
            <input id="patternScaleNumber" type="number" min="0" max="200" step="5" value="100" aria-label="Pattern scale percent number">
            <span>%</span>
          </div>
        </div>
      </section>

      <div class="footer-actions">
        <button id="unlockButton" class="ghost" type="button">Clear Locks</button>
        <button id="monoButton" class="ghost" type="button">Calmer</button>
      </div>
      <div id="status" class="status"></div>
    </aside>
  </main>

        c.moveTo(x + 4, tile.height);
        c.lineTo(x + tile.height + 4, 0);
        c.stroke();
      }
      c.restore();

      for (let y = 0; y < tile.height; y += 3) {
        c.globalAlpha = 0.06 + rand() * 0.08;
        c.fillStyle = highlight;
        c.fillRect(0, y, tile.width, 1);
      }
      for (let x = 0; x < tile.width; x += 4) {
        c.globalAlpha = 0.05 + rand() * 0.08;
        c.fillStyle = rand() > 0.5 ? thread : highlight;
        c.fillRect(x, 0, 1, tile.height);
      }
      c.globalAlpha = 0.08;
      for (let i = 0; i < 600; i += 1) {
        c.fillStyle = rand() > 0.55 ? "#ffffff" : "#000000";
        c.fillRect(Math.floor(rand() * tile.width), Math.floor(rand() * tile.height), 1, 1);
      }
      c.globalAlpha = 1;
    }

    function denimFade(tile, rand) {
      const c = tile.getContext("2d");
      const glow = c.createRadialGradient(46, 36, 4, 50, 44, 78);
      glow.addColorStop(0, "rgba(244, 252, 255, 0.28)");
      glow.addColorStop(0.48, "rgba(203, 228, 239, 0.12)");
      glow.addColorStop(1, "rgba(51, 101, 132, 0)");
      c.fillStyle = glow;
      c.fillRect(0, 0, tile.width, tile.height);

      c.save();
      c.globalAlpha = 0.16;
      c.strokeStyle = "#2e617d";
      c.lineWidth = 1;
      for (let x = -tile.height; x < tile.width + tile.height; x += 11) {
        c.beginPath();
        c.moveTo(x, tile.height);
        c.lineTo(x + tile.height, 0);
        c.stroke();
      }
      c.globalAlpha = 0.08;
      c.strokeStyle = "#f6fbff";
      for (let i = 0; i < 18; i += 1) {
        const y = rand() * tile.height;
        c.beginPath();
        c.moveTo(0, y);
        c.lineTo(tile.width, y + rand() * 8 - 4);
        c.stroke();
      }
      c.restore();
    }

    function choosePattern(part, rand, quiet = false) {
      return randomFrom(patterns, rand).id;
    }

    function canTiltPattern(part) {
      return part?.group === "leftSleeve" || part?.group === "rightSleeve";
    }

    function getPartAngle(part) {
      return canTiltPattern(part) ? (part.angle || 0) : 0;
    }

    function getPatternRotation(part, rand) {
      if (!canTiltPattern(part)) return 0;
      return (rand() - 0.5) * 0.04;
    }

    function randomizeAll(options = {}) {
      const quiet = Boolean(options.quiet);
      state.seed = Number(seedInput.value) || Date.now() % 100000;
      const rand = mulberry32(hashString(`${state.seed}:${quiet ? "quiet" : "all"}`));
      const seen = new Set();

      for (const part of parts) {
        if (part.fixedPatternId) continue;
        const key = getMaterialKey(part);
        if (seen.has(key) || isLocked(part)) continue;
        seen.add(key);
        setPartPattern(part, rand, null, quiet);
      }

      render();
      renderPartsList();
      syncPatternLibrary();
      syncScaleControls();
      setStatus(`Seed ${state.seed}`);
    }

    function setPartPattern(part, rand, patternId = null, quiet = false) {
      if (!part) return;
      if (part.fixedPatternId) {
        state.selectedPattern = part.fixedPatternId;
        return;
      }
      const key = getMaterialKey(part);
      if (patternId) {
        state.assignments.set(key, patternId);
      } else {
        state.assignments.set(key, choosePattern(part, rand, quiet));
      }
      state.selectedPattern = state.assignments.get(key);
      state.rotations.set(key, getPatternRotation(part, rand));
    }

    function randomizeSelectedPart(patternId = null) {
      const part = partsById.get(state.selectedPart);
      if (part?.fixedPatternId) {
        state.selectedPattern = part.fixedPatternId;
        render();
        renderPartsList();
        syncPatternLibrary();
        syncScaleControls();
        setStatus(`${part.label} is fixed`);
        return;
      }
      const rand = mulberry32(hashString(`${state.seed}:${getMaterialKey(part)}:${Date.now()}`));
      setPartPattern(part, rand, patternId);
      render();
      renderPartsList();
      syncPatternLibrary();
      syncScaleControls();
    }

    function randomizePartList(ids, label = "part") {
      const rand = mulberry32(hashString(`${state.seed}:${label}:${Date.now()}`));
      let changed = 0;
      const seen = new Set();
      for (const id of ids) {
        const part = partsById.get(id);
        if (!part || part.fixedPatternId) continue;
        const key = getMaterialKey(part);
        if (!part || seen.has(key) || isLocked(part)) continue;
        seen.add(key);
        setPartPattern(part, rand);
        changed += 1;
      }
      render();
      renderPartsList();
      syncPatternLibrary();
      syncScaleControls();
      setStatus(`${label}: ${changed}`);
    }

    function setStatus(text) {
      statusEl.textContent = text;
      window.clearTimeout(setStatus.timer);
      setStatus.timer = window.setTimeout(() => {
        statusEl.textContent = "";
      }, 2600);
    }

    function drawPatternInPath(part) {
      const key = getMaterialKey(part);
      const patternId = state.assignments.get(key) || patterns[0].id;
      const tile = createTile(patternId);
      const fill = ctx.createPattern(tile, "repeat");
      ctx.save();
      applySvgTransform();
      ctx.clip(part.path2d);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.translate(W / 2, H / 2);
      ctx.rotate(getPartAngle(part) + (state.rotations.get(key) || 0));
      ctx.scale(0.84, 0.84);
      ctx.fillStyle = fill;
      ctx.fillRect(-W, -H, W * 2, H * 2);
      ctx.restore();
    }

    function strokePath(path, width = 2, color = "#171511") {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.stroke(path);
      ctx.restore();
    }

    function dashLine(points, color = "rgba(20,18,14,0.42)") {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.2;
      ctx.setLineDash([8, 8]);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(points[0][0], points[0][1]);
      for (let i = 1; i < points.length; i += 1) {
        ctx.lineTo(points[i][0], points[i][1]);
      }
      ctx.stroke();
      ctx.restore();
    }

    function seamPath(pathString) {
      const path = new Path2D(pathString);
      ctx.save();
      ctx.strokeStyle = "rgba(20,18,14,0.42)";
      ctx.lineWidth = 1.1;
      ctx.setLineDash([7, 7]);
      ctx.lineJoin = "round";
      ctx.stroke(path);
      ctx.restore();
    }

    function button(x, y, radius = 7) {
      ctx.save();
      ctx.fillStyle = "#fffdf7";
      ctx.strokeStyle = "#15130f";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x - 3, y);
      ctx.lineTo(x + 3, y);
      ctx.moveTo(x, y - 3);
      ctx.lineTo(x, y + 3);
      ctx.stroke();
      ctx.restore();
    }

    function rivet(x, y) {
      ctx.save();
      ctx.fillStyle = "#fffdf7";
      ctx.strokeStyle = "#15130f";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(x, y, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawDetails() {
      ctx.save();
      applySvgTransform();
      ctx.globalAlpha = 0.96;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.strokeStyle = "#010101";
      ctx.lineWidth = 0.7;
      for (const part of orderedParts) {
        ctx.stroke(part.path2d);
      }
      for (const extra of overlayExtras) {
        ctx.save();
        if (extra.type === "path") {
          ctx.strokeStyle = extra.stroke || "#010101";
          ctx.fillStyle = extra.fill || "transparent";
          ctx.lineWidth = extra.lineWidth || 0.7;
          if (extra.fill && extra.fill !== "none") ctx.fill(extra.path);
          if (extra.stroke && extra.stroke !== "none") ctx.stroke(extra.path);
        }
        if (extra.type === "rect") {
          ctx.fillStyle = extra.fill || "#010101";
          ctx.fillRect(extra.x, extra.y, extra.width, extra.height);
        }
        if (extra.type === "dot") {
          ctx.fillStyle = "#020202";
          ctx.beginPath();
          ctx.arc(extra.x, extra.y, extra.radius, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
      ctx.restore();
    }

    function drawLabels() {
      const front = svgToCanvas(104, 247);
      const back = svgToCanvas(319, 247);
      ctx.save();
      ctx.fillStyle = "rgba(22,20,16,0.58)";
      ctx.font = "12px Avenir Next, Helvetica Neue, sans-serif";
      ctx.letterSpacing = "0px";
      ctx.textAlign = "center";
      ctx.fillText("FRONT", front.x, front.y);
      ctx.fillText("BACK", back.x, back.y);
      ctx.restore();
    }

    function drawHighlight() {
      const targetId = state.hoveredPart || state.selectedPart;
      const part = partsById.get(targetId);
      if (!part) return;
      const targetKey = getMaterialKey(part);
      const targetParts = parts.filter((candidate) => getMaterialKey(candidate) === targetKey);
      ctx.save();
      applySvgTransform();
      ctx.strokeStyle = state.hoveredPart ? "#cf2e2e" : "#245bb7";
      ctx.lineWidth = 1.35;
      ctx.setLineDash([4, 2.8]);
      for (const targetPart of targetParts) {
        ctx.stroke(targetPart.path2d);
      }
      ctx.restore();
    }

    function drawCanvasBackdrop() {
      ctx.save();
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "#fffdf8";
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 0.05;
      ctx.strokeStyle = "#161410";
      ctx.lineWidth = 1;
      for (let x = 40; x < W; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
      for (let y = 40; y < H; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }
      ctx.restore();
    }

    function render() {
      drawCanvasBackdrop();

      ctx.save();
      ctx.shadowColor = "rgba(36,28,18,0.14)";
      ctx.shadowBlur = 14;
      ctx.shadowOffsetY = 8;
      for (const part of orderedParts) {
        drawPatternInPath(part);
      }
      ctx.restore();

      drawDetails();
      drawHighlight();
      drawLabels();
    }

    function renderPartRow(part) {
      const row = document.createElement("div");
      row.className = "part-row" + (part.id === state.selectedPart ? " active" : "");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = isLocked(part) || Boolean(part.fixedPatternId);
      checkbox.disabled = Boolean(part.fixedPatternId);
      checkbox.ariaLabel = `Lock ${part.label}`;
      checkbox.addEventListener("change", () => {
        const key = getMaterialKey(part);
        if (checkbox.checked) {
          state.locked.add(key);
        } else {
          state.locked.delete(key);
        }
        renderPartsList();
      });

      const pickButton = document.createElement("button");
      pickButton.type = "button";
      pickButton.addEventListener("click", () => {
        state.selectedPart = part.id;
        state.selectedPattern = getPartPatternId(part) || state.selectedPattern;
        render();
        renderPartsList();
        syncPatternLibrary();
        syncScaleControls();
      });
      pickButton.addEventListener("dblclick", () => randomizeSelectedPart());

      const name = document.createElement("span");
      name.className = "part-name";
      name.textContent = part.label;

      const patternName = document.createElement("span");
      patternName.className = "part-pattern";
      const pattern = patternsById.get(getPartPatternId(part));
      patternName.textContent = pattern ? pattern.name : "";

      pickButton.append(name, patternName);

      const reroll = document.createElement("button");
      reroll.className = "part-reroll";
      reroll.type = "button";
      reroll.title = part.fixedPatternId ? "Fixed material" : "Randomize this part only";
      reroll.textContent = "RND";
      reroll.disabled = Boolean(part.fixedPatternId);
      reroll.addEventListener("click", () => {
        state.selectedPart = part.id;
        state.selectedPattern = getPartPatternId(part) || state.selectedPattern;
        randomizeSelectedPart();
      });

      const swatch = document.createElement("canvas");
      swatch.className = "tiny-swatch";
      swatch.width = 152;
      swatch.height = 48;
      paintSwatch(swatch, getPartPatternId(part));

      row.append(checkbox, pickButton, reroll, swatch);
      return row;
    }

    function getLockableCoreParts() {
      return corePartIds.map((id) => partsById.get(id)).filter((part) => part && !part.fixedPatternId);
    }

    function areCorePartsLocked() {
      const coreParts = getLockableCoreParts();
      return coreParts.length > 0 && coreParts.every((part) => isLocked(part));
    }

    function syncCoreLockButton() {
      const locked = areCorePartsLocked();
      coreLockButton.textContent = locked ? "Unlock Block" : "Lock Block";
      coreLockButton.setAttribute("aria-pressed", locked ? "true" : "false");
    }

    function renderPartsList() {
      corePartsList.replaceChildren();
      partsList.replaceChildren();

      for (const id of corePartIds) {
        const part = partsById.get(id);
        if (part) corePartsList.append(renderPartRow(part));
      }

      for (const part of orderedParts) {
        if (!corePartIdSet.has(part.id)) {
          partsList.append(renderPartRow(part));
        }
      }

      syncCoreLockButton();
    }

    function renderQuickControls() {
      const quickActions = [
        { label: "Selected Part", ids: () => [state.selectedPart] },
        { label: "Whole Shirt", ids: () => parts.map((part) => part.id) },
        { label: "Front", ids: () => parts.filter((part) => part.side === "front").map((part) => part.id) },
        { label: "Full Back", ids: () => parts.filter((part) => part.side === "back").map((part) => part.id) },
        { label: "Back Body", ids: () => ["backBody"] },
        { label: "Back Yoke", ids: () => ["backYoke"] },
        { label: "Left Sleeve", ids: () => parts.filter((part) => part.group === "leftSleeve").map((part) => part.id) },
        { label: "Right Sleeve", ids: () => parts.filter((part) => part.group === "rightSleeve").map((part) => part.id) },
        { label: "Left Cuff", ids: () => parts.filter((part) => part.group === "leftCuff").map((part) => part.id) },
        { label: "Right Cuff", ids: () => parts.filter((part) => part.group === "rightCuff").map((part) => part.id) },
        { label: "Yokes", ids: () => parts.filter((part) => part.group === "yoke").map((part) => part.id) },
        { label: "Pockets", ids: () => parts.filter((part) => part.group === "pocket").map((part) => part.id) },
        { label: "Collars", ids: () => parts.filter((part) => part.group === "collar").map((part) => part.id) }
      ];

      quickControls.replaceChildren();
      for (const action of quickActions) {
        const buttonEl = document.createElement("button");
        buttonEl.className = "quick-button";
        buttonEl.type = "button";
        buttonEl.textContent = action.label;
        buttonEl.addEventListener("click", () => randomizePartList(action.ids(), action.label));
        quickControls.append(buttonEl);
      }
    }

    function paintSwatch(target, patternId) {
      const c = target.getContext("2d");
      const pattern = c.createPattern(createTile(patternId || patterns[0].id), "repeat");
      c.fillStyle = pattern;
      c.fillRect(0, 0, target.width, target.height);
      c.strokeStyle = "rgba(22,20,16,0.18)";
      c.strokeRect(0.5, 0.5, target.width - 1, target.height - 1);
    }

    function renderPatternLibrary() {
      patternLibrary.replaceChildren();
      for (const pattern of patterns) {
        const buttonEl = document.createElement("button");
        buttonEl.className = "pattern-button";
        buttonEl.type = "button";
        buttonEl.title = pattern.name;
        buttonEl.ariaLabel = pattern.name;
        buttonEl.dataset.patternId = pattern.id;
        buttonEl.setAttribute("aria-pressed", "false");
        buttonEl.addEventListener("click", () => {
          state.selectedPattern = pattern.id;
          randomizeSelectedPart(pattern.id);
          for (const node of patternLibrary.querySelectorAll(".pattern-button")) {
            node.setAttribute("aria-pressed", "false");
          }
          buttonEl.setAttribute("aria-pressed", "true");
          syncScaleControls();
        });

        const swatch = document.createElement("canvas");
        swatch.width = 160;
        swatch.height = 108;
        paintSwatch(swatch, pattern.id);
        buttonEl.append(swatch);
        patternLibrary.append(buttonEl);
      }
      syncPatternLibrary();
      syncScaleControls();
    }

    function syncPatternLibrary() {
      const selectedPattern = getActivePatternId();
      for (const node of patternLibrary.querySelectorAll(".pattern-button")) {
        node.setAttribute("aria-pressed", node.dataset.patternId === selectedPattern ? "true" : "false");
      }
    }

    function syncScaleControls() {
      const patternId = getActivePatternId();
      const pattern = patternsById.get(patternId) || patterns[0];
      const scale = getPatternScale(pattern.id);
      scalePatternName.textContent = pattern.name;
      patternScaleSlider.value = scale;
      patternScaleNumber.value = scale;
    }

    function updatePatternScale(value) {
      const patternId = getActivePatternId();
      const scale = clampScale(value);
      setPatternScale(patternId, scale);
      tileCache.clear();
      render();
      renderPartsList();
      renderPatternLibrary();
      syncPatternLibrary();
      syncScaleControls();
    }

    function findPartAt(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const x = (clientX - rect.left) * (canvas.width / rect.width);
      const y = (clientY - rect.top) * (canvas.height / rect.height);
      const point = canvasToSvg(x, y);
      for (let i = orderedParts.length - 1; i >= 0; i -= 1) {
        const part = orderedParts[i];
        if (ctx.isPointInPath(part.path2d, point.x, point.y)) {
          return part;
        }
      }
      return null;
    }

    canvas.addEventListener("mousemove", (event) => {
      const part = findPartAt(event.clientX, event.clientY);
      const nextId = part ? part.id : null;
      if (state.hoveredPart !== nextId) {
        state.hoveredPart = nextId;
        canvas.style.cursor = part ? "pointer" : "default";
        render();
      }
    });

    canvas.addEventListener("mouseleave", () => {
      state.hoveredPart = null;
      canvas.style.cursor = "default";
      render();
    });

    canvas.addEventListener("click", (event) => {
      const part = findPartAt(event.clientX, event.clientY);
      if (!part) return;
      state.selectedPart = part.id;
      state.selectedPattern = getPartPatternId(part) || state.selectedPattern;
      render();
      renderPartsList();
      syncPatternLibrary();
      syncScaleControls();
    });

    canvas.addEventListener("dblclick", (event) => {
      const part = findPartAt(event.clientX, event.clientY);
      if (!part) return;
      state.selectedPart = part.id;
      state.selectedPattern = getPartPatternId(part) || state.selectedPattern;
      randomizeSelectedPart();
    });

    randomizeButton.addEventListener("click", () => {
      state.seed = (Number(seedInput.value) || state.seed) + 1;
      seedInput.value = state.seed;
      randomizeAll();
    });

    seedInput.addEventListener("change", () => {
      state.seed = Number(seedInput.value) || Date.now() % 100000;
      seedInput.value = state.seed;
      randomizeAll();
    });

    coreLockButton.addEventListener("click", () => {
      const shouldLock = !areCorePartsLocked();
      for (const part of getLockableCoreParts()) {
        const key = getMaterialKey(part);
        if (shouldLock) {
          state.locked.add(key);
        } else {
          state.locked.delete(key);
        }
      }
      renderPartsList();
      setStatus(shouldLock ? "Core parts locked" : "Core parts unlocked");
    });

    unlockButton.addEventListener("click", () => {
      state.locked.clear();
      renderPartsList();
      setStatus("Locks cleared");
    });

    monoButton.addEventListener("click", () => {
      randomizeAll({ quiet: true });
      setStatus("Calmer layout");
    });

    patternScaleSlider.addEventListener("input", () => {
      updatePatternScale(patternScaleSlider.value);
    });

    patternScaleNumber.addEventListener("input", () => {
      updatePatternScale(patternScaleNumber.value);
    });

    patternScaleNumber.addEventListener("change", () => {
      updatePatternScale(patternScaleNumber.value);
    });

    saveButton.addEventListener("click", () => {
      const safeSeed = String(state.seed).replace(/[^\d]/g, "") || "shirt";
      canvas.toBlob((blob) => {
        if (!blob) {
          setStatus("PNG export failed");
          return;
        }
        const anchor = document.createElement("a");
        const url = URL.createObjectURL(blob);
        anchor.download = `ks-shirt-${safeSeed}.png`;
        anchor.href = url;
        anchor.click();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
        setStatus("PNG saved");
      }, "image/png");
    });

    renderQuickControls();
    renderPatternLibrary();
    randomizeAll();
  </script>
</body>
</html>
